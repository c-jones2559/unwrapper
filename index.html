<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Unwrapper</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon-192.png" type="image/png">
</head>
<body>
    <h1>Unwrapper</h1>
    <h2>New here? Here's some <a href="https://unwrapper.cjones.cymru/info">info</a>.</h2>
    <label for="input">Input your data here:</label><br/>


    <input type="file" id="input" name="input" accept=".json" multiple/>
    <!-- <button id="processBtn" onclick="buttonClick()">Process</button> -->

    <button id="processBtn">Process</button>
    <script type="module" src="fileReader.js"></script>
    
    <!-- <p id="valid"></p> -->

    <section id="bento-grid" class="hidden">
        <div class="card big-card">
            <h3>Total Time</h3>
            <div id="total-time-display">0 mins</div>
        </div>
        <div class="card small-card">
            <h3>Top Artist</h3>
            <div id="top-artist-display">-</div>
        </div>
        <div class="card small-card">
            <h3>Top Song</h3>
            <div id="top-song-display">-</div>
        </div>
    </section>
    
    <nav id="controls" class="hidden">
        <div class="tabs">
            <button class="tab-btn active" data-tab="songs">Songs</button>
            <button class="tab-btn" data-tab="artists">Artists</button>
            <button class="tab-btn" data-tab="albums">Albums</button>
        </div>
    
        <div class="filters">
            <select id="time-range">
                <option value="all">All Time</option>
                <option value="2025">2025</option>
                <option value="2024">2024</option>
                </select>
        </div>
    </nav>

<div id="content-viewport">
    </div>

    <!-- <script src="fileReader.js"></script> -->
    <!-- <script src="statsProcessor.js"></script> -->
</body>
</html>
